name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          name="mandarin-srs-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "$name/data"
          cp target/release/mandarin-srs README.md LICENSE "$name/"
          cp data/hsk_words.json "$name/data/"
          tar -czf "${name}.tar.gz" "$name"

      - uses: softprops/action-gh-release@v2
        with:
          files: mandarin-srs-*.tar.gz
          generate_release_notes: true